<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鬼娘花嫁 · 登录</title>
<style>
  :root{
    --bg1:#6A3A8E;
    --bg2:#3B2363;
    --bg3:#170C2B;
    --pink:#FF6F9C;
    --pink-deep:#E84A78;
    --rose:#FFB3C8;
    --gold:#F4D58B;
    --ivory:#FFF7FB;
    --line:#F0D9E4;
    --ink:#4A2A3A;
    --ink-soft:#8A6A82;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0; min-height:100vh; padding:48px 16px;
    display:grid; place-items:center; position:relative; overflow-x:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 8%, rgba(255,179,200,.18) 0%, rgba(255,179,200,0) 40%),
      radial-gradient(circle at 50% 12%, var(--bg1) 0%, var(--bg2) 44%, var(--bg3) 100%);
    background-attachment:fixed;
  }

  /* ---------- 夜空氛围 ---------- */
  .moon{
    position:fixed; left:50%; top:5%; transform:translateX(-50%);
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle at 38% 36%, #FFF6FB 0%, #F7D9EA 55%, #E9B9D6 100%);
    box-shadow:0 0 70px 24px rgba(247,200,230,.45), 0 0 160px 50px rgba(190,120,180,.25);
    z-index:1;
  }
  .moon::after{
    content:""; position:absolute; right:30px; top:34px; width:34px; height:34px; border-radius:50%;
    background:rgba(200,150,190,.28);
    box-shadow:-46px 36px 0 -6px rgba(200,150,190,.22), 28px 60px 0 -12px rgba(200,150,190,.2);
  }
  .sky{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
  .star{ position:absolute; color:#FFF3FA; font-size:13px; text-shadow:0 0 6px #fff; animation:twinkle linear infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.15);} }

  .petal{ position:absolute; top:-8vh; font-size:18px; will-change:transform; animation:fall linear infinite; opacity:0; }
  @keyframes fall{
    0%  { transform:translate(0,-10vh) rotate(0); opacity:0; }
    8%  { opacity:.95; }
    100%{ transform:translate(46px,116vh) rotate(420deg); opacity:.7; }
  }
  .firefly{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle, #FFF6C9 0%, rgba(255,246,201,.5) 45%, rgba(255,246,201,0) 75%);
    box-shadow:0 0 10px 3px rgba(255,243,170,.7);
    animation:drift ease-in-out infinite;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:.25; }
    50%{ transform:translate(34px,-30px); opacity:1; }
    100%{ transform:translate(-22px,-58px); opacity:.25; }
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative; z-index:5;
    width:min(440px,94vw);
    padding:22px 30px 30px;
    background:linear-gradient(180deg,#FFFDFE 0%, #FDF3F8 100%);
    border:2px solid var(--gold);
    border-radius:26px;
    box-shadow:0 30px 70px rgba(20,8,40,.55), 0 0 0 6px rgba(255,179,200,.18), 0 0 40px rgba(232,74,120,.25) inset;
    text-align:center;
    animation:cardIn .8s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(28px) scale(.96);} to{opacity:1; transform:none;} }
  .card.shake{ animation:shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake{
    10%,90%{ transform:translateX(-6px);} 20%,80%{ transform:translateX(7px);}
    30%,50%,70%{ transform:translateX(-9px);} 40%,60%{ transform:translateX(9px);}
  }
  .card::before{
    content:"💕"; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    font-size:24px; filter:drop-shadow(0 2px 4px rgba(232,74,120,.4));
  }
  .card::after{
    content:""; position:absolute; inset:9px; border:1px dashed rgba(232,74,120,.35);
    border-radius:18px; pointer-events:none;
  }

  /* ---------- 鬼娘花嫁 ---------- */
  .mascot{
    width:180px; height:auto; margin:2px auto 0; display:block;
    animation:float 4.6s ease-in-out infinite;
    filter:drop-shadow(0 14px 16px rgba(30,10,50,.4));
  }
  @keyframes float{ 0%,100%{ transform:translateY(0) rotate(-1deg);} 50%{ transform:translateY(-9px) rotate(1deg);} }
  .mascot.happy{ animation:blush 1s ease-in-out 2; }
  @keyframes blush{ 0%,100%{ transform:scale(1) rotate(0);} 30%{ transform:scale(1.07) rotate(-3deg);} 65%{ transform:scale(1.07) rotate(3deg);} }

  .hair{ transform-box:fill-box; transform-origin:center top; animation:sway 6s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{ transform:rotate(-1.2deg);} 50%{ transform:rotate(1.6deg);} }
  .eyelid{ transform-box:fill-box; transform-origin:center; animation:blink 5.2s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(0);} 95%,97%{ transform:scaleY(1);} }
  .pupil{ transition:transform .12s ease-out; }
  .blush{ opacity:0; transition:opacity .5s; }
  .mascot.happy .blush{ opacity:.75; }

  h1{
    margin:12px 0 4px; font-size:26px; letter-spacing:3px;
    font-family:Georgia,"Songti SC","STSong","SimSun",serif; color:var(--ink);
    text-shadow:0 0 18px rgba(255,179,200,.5);
  }
  .sub{ margin:0 0 22px; font-size:12px; letter-spacing:4px; color:var(--pink-deep); font-weight:600; }

  form{ text-align:left; }

  .field{ margin-bottom:15px; }
  .field label{
    display:block; margin:0 0 7px 4px; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); letter-spacing:1px;
  }
  .input-wrap{ position:relative; }
  .input-wrap .ico{ position:absolute; left:15px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.55; pointer-events:none; }
  input[type="text"], input[type="password"]{
    width:100%; padding:14px 46px 14px 42px; font-size:15px; color:var(--ink);
    background:#FFFDFE; border:2px solid var(--line); border-radius:15px; outline:none;
    transition:border-color .2s, box-shadow .2s; font-family:inherit;
  }
  input::placeholder{ color:#C9B3C2; }
  input:hover{ border-color:#F3C9DC; }
  input:focus{ border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,111,156,.22); }

  .toggle{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; display:grid; place-items:center; border:none; background:transparent;
    border-radius:10px; font-size:15px; cursor:pointer; opacity:.6; transition:.18s;
  }
  .toggle:hover{ opacity:1; background:#FCE6EF; }

  .row{ display:flex; align-items:center; justify-content:space-between; margin:4px 2px 20px; font-size:12.5px; color:var(--ink-soft); }
  .remember{ display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  .remember input{ position:absolute; opacity:0; pointer-events:none; }
  .box{ width:17px; height:17px; border-radius:6px; border:2px solid var(--line); background:#FFFDFE;
        display:grid; place-items:center; transition:.18s; font-size:10px; color:#fff; line-height:1; }
  .remember input:checked + .box{ background:var(--pink); border-color:var(--pink); }
  .remember input:checked + .box::after{ content:"♥"; font-size:11px; }
  a.link{ color:var(--pink-deep); text-decoration:none; border-bottom:1px dashed rgba(232,74,120,.55); }
  a.link:hover{ color:#C93A66; }

  .btn{
    width:100%; padding:15px; border:none; border-radius:17px;
    font-family:Georgia,"Songti SC",serif; font-size:16px; font-weight:700; letter-spacing:4px; color:#fff;
    background:linear-gradient(180deg,#FF8FB4,#E84A78);
    box-shadow:0 6px 0 #C93363, 0 14px 24px rgba(232,74,120,.45);
    cursor:pointer; transition:transform .14s, box-shadow .14s, filter .2s;
  }
  .btn:hover{ filter:brightness(1.05); transform:translateY(-2px); box-shadow:0 8px 0 #C93363, 0 18px 28px rgba(232,74,120,.5); }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #C93363, 0 6px 12px rgba(232,74,120,.35); }
  .btn:disabled{ cursor:default; }
  .btn.ok{ background:linear-gradient(180deg,#9B6BD6,#6A3AA0); box-shadow:0 6px 0 #4F2A7E, 0 12px 20px rgba(106,58,160,.45); }

  .hint{ margin:12px 0 0; min-height:18px; font-size:12.5px; color:var(--pink-deep); opacity:0; transform:translateY(-4px); transition:.22s; }
  .hint.show{ opacity:1; transform:none; }

  .divider{ display:flex; align-items:center; gap:12px; margin:22px 0 16px; color:#D8BBD0; font-size:11px; letter-spacing:1px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  .socials{ display:flex; gap:12px; justify-content:center; }
  .social{ width:52px; height:44px; border-radius:14px; border:2px solid var(--line); background:#FFFDFE;
           display:grid; place-items:center; font-size:18px; cursor:pointer; transition:.18s; }
  .social:hover{ border-color:var(--pink); transform:translateY(-3px); box-shadow:0 8px 14px rgba(255,111,156,.3); }

  .foot{ margin:20px 0 0; font-size:12.5px; color:var(--ink-soft); }

  .hearts{ position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden; }
  .heart-fx{ position:absolute; font-size:20px; animation:floatUp 1.7s ease-out forwards; }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(0) scale(.4) rotate(0);}
    25%{ opacity:1;}
    100%{ opacity:0; transform:translateY(-210px) scale(1.3) rotate(180deg);}
  }

  @media (max-width:420px){ .card{ padding:18px 20px 24px; border-radius:22px;} .mascot{ width:152px;} h1{ font-size:22px;} }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>

<div class="moon"></div>
<div class="sky" id="sky"></div>

<main class="card" id="card">

  <!-- ============ 鬼娘花嫁 ============ -->
  <svg class="mascot" id="mascot" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skin" cx="0.4" cy="0.35" r="0.8">
        <stop offset="0" stop-color="#FFF4F8"/><stop offset="1" stop-color="#F7DCE8"/>
      </radialGradient>
      <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F2ECFB"/><stop offset="1" stop-color="#D6CBEE"/>
      </linearGradient>
      <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FF92B4"/><stop offset="1" stop-color="#E84A78"/>
      </linearGradient>
      <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
        <stop offset="0" stop-color="#FFC2D6"/><stop offset="0.7" stop-color="#D85A8E"/><stop offset="1" stop-color="#9E2E63"/>
      </radialGradient>
      <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E9F5"/>
      </linearGradient>
    </defs>

    <!-- 影子 -->
    <ellipse cx="120" cy="288" rx="58" ry="8" fill="#0E0620" opacity="0.3"/>

    <g class="hair">
      <!-- 头发后层 -->
      <path d="M120 36 C66 36 50 76 56 128 C60 176 44 214 52 256 C72 260 82 236 86 206 C90 240 112 256 120 226 C128 256 150 240 154 206 C158 236 168 260 188 256 C196 214 180 176 184 128 C190 76 174 36 120 36 Z" fill="url(#hair)"/>
    </g>

    <!-- 头纱（半透明） -->
    <path d="M70 70 C60 120 58 170 64 214 C90 206 96 170 100 140 C112 170 128 170 140 140 C144 170 150 206 176 214 C182 170 180 120 170 70 C150 50 90 50 70 70 Z"
          fill="#FFFFFF" opacity="0.4"/>

    <!-- 脸 -->
    <ellipse cx="120" cy="96" rx="50" ry="48" fill="url(#skin)"/>

    <!-- 刘海 -->
    <path d="M74 80 C92 58 148 58 166 80 C152 66 134 84 120 74 C106 84 88 66 74 80 Z" fill="url(#hair)"/>
    <path d="M74 80 C84 70 96 76 100 86 C90 84 82 86 78 92 Z" fill="#C9BCE8" opacity="0.6"/>
    <path d="M166 80 C156 70 144 76 140 86 C150 84 158 86 162 92 Z" fill="#C9BCE8" opacity="0.6"/>

    <!-- 鬼角 -->
    <path d="M96 54 C86 40 80 28 76 14 C86 24 96 38 106 48 Z" fill="url(#horn)" stroke="#C93363" stroke-width="1.2"/>
    <path d="M144 54 C154 40 160 28 164 14 C154 24 144 38 134 48 Z" fill="url(#horn)" stroke="#C93363" stroke-width="1.2"/>

    <!-- 头花/冠 -->
    <circle cx="120" cy="42" r="7" fill="#FF8FB4"/>
    <circle cx="108" cy="46" r="4.5" fill="#FFB3C8"/>
    <circle cx="132" cy="46" r="4.5" fill="#FFB3C8"/>
    <circle cx="120" cy="42" r="2.4" fill="#F4D58B"/>

    <!-- 腮红（默认隐藏，成功显示） -->
    <ellipse class="blush" cx="86" cy="112" rx="11" ry="6" fill="#FF8FB4"/>
    <ellipse class="blush" cx="154" cy="112" rx="11" ry="6" fill="#FF8FB4"/>

    <!-- 眼睛 -->
    <g>
      <ellipse class="iris" cx="100" cy="94" rx="13" ry="16" fill="url(#eye)" stroke="#7A2350" stroke-width="1.4"/>
      <ellipse cx="100" cy="100" rx="8" ry="9" fill="#FFE3EE" opacity="0.45"/>
      <circle class="pupil" cx="100" cy="94" r="5.4" fill="#3A1226"/>
      <circle cx="97" cy="90" r="2.1" fill="#fff"/>
      <ellipse class="eyelid" cx="100" cy="94" rx="13.5" ry="16.5" fill="#F7DCE8"/>
    </g>
    <g>
      <ellipse class="iris" cx="140" cy="94" rx="13" ry="16" fill="url(#eye)" stroke="#7A2350" stroke-width="1.4"/>
      <ellipse cx="140" cy="100" rx="8" ry="9" fill="#FFE3EE" opacity="0.45"/>
      <circle class="pupil" cx="140" cy="94" r="5.4" fill="#3A1226"/>
      <circle cx="137" cy="90" r="2.1" fill="#fff"/>
      <ellipse class="eyelid" cx="140" cy="94" rx="13.5" ry="16.5" fill="#F7DCE8"/>
    </g>

    <!-- 嘴 + 小虎牙 -->
    <path d="M112 120 Q120 128 128 120" fill="none" stroke="#9E2E63" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M114 121 l2.4 0 l-1.2 4 Z" fill="#fff" stroke="#D8A" stroke-width="0.4"/>
    <path d="M126 121 l-2.4 0 l1.2 4 Z" fill="#fff" stroke="#D8A" stroke-width="0.4"/>

    <!-- 婚纱 -->
    <path d="M90 138 C78 160 68 206 60 282 L180 282 C172 206 162 160 150 138 C140 152 100 152 90 138 Z"
          fill="url(#dress)" stroke="#E9D7EC" stroke-width="1.5"/>
    <!-- 领口 -->
    <path d="M90 138 C104 150 136 150 150 138 C140 156 100 156 90 138 Z" fill="#FFE3EE"/>
    <!-- 胸前蝴蝶结 -->
    <path d="M120 150 l-16 -8 v16 Z" fill="#FF8FB4"/>
    <path d="M120 150 l16 -8 v16 Z" fill="#FF8FB4"/>
    <circle cx="120" cy="150" r="4" fill="#E84A78"/>
    <!-- 裙摆荷叶边 -->
    <path d="M60 282 q15 -14 30 0 q15 -14 30 0 q15 -14 30 0 q15 -14 30 0" fill="none" stroke="#E9D7EC" stroke-width="2"/>
    <!-- 裙身竖褶 -->
    <path d="M96 152 C92 200 88 240 84 278" fill="none" stroke="#EFE2F1" stroke-width="1.4"/>
    <path d="M120 154 L120 280" fill="none" stroke="#EFE2F1" stroke-width="1.4"/>
    <path d="M144 152 C148 200 152 240 156 278" fill="none" stroke="#EFE2F1" stroke-width="1.4"/>
  </svg>
  <!-- ========== /鬼娘花嫁 ========== -->

  <h1>鬼娘花嫁</h1>
  <p class="sub">月 夜 婚 礼 · 请 君 入 瓮</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="user">夫君名讳</label>
      <div class="input-wrap">
        <span class="ico">💍</span>
        <input id="user" type="text" placeholder="留下你的名字，与我结契" autocomplete="username" />
      </div>
    </div>

    <div class="field">
      <label for="pass">结契暗语</label>
      <div class="input-wrap">
        <span class="ico">🕯️</span>
        <input id="pass" type="password" placeholder="嘘…别让阎王听见" autocomplete="current-password" />
        <button class="toggle" id="toggle" type="button" aria-label="显示暗语">👀</button>
      </div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" id="remember" />
        <span class="box"></span>
        <span>来世也要记得我</span>
      </label>
      <a class="link" href="#">暗语飘散在风里了</a>
    </div>

    <button class="btn" id="submitBtn" type="submit">缔 结 婚 约</button>
    <p class="hint" id="hint"></p>
  </form>

  <div class="divider">或借冥婚之媒</div>
  <div class="socials">
    <button class="social" type="button" title="彼岸">💀</button>
    <button class="social" type="button" title="红烛">🕯️</button>
    <button class="social" type="button" title="玫瑰">🌹</button>
  </div>

  <p class="foot">还未被选中？<a class="link" href="#">那便再等一等吧</a></p>
</main>

<div class="hearts" id="hearts"></div>

<script>
(function () {
  /* ---------- 星空 / 花瓣 / 萤火 ---------- */
  var sky = document.getElementById('sky');
  var starGlyphs = ['✦','✧','⋆','✺'];
  for (var s = 0; s < 26; s++) {
    var st = document.createElement('span');
    st.className = 'star';
    st.textContent = starGlyphs[s % starGlyphs.length];
    st.style.left = (Math.random() * 100) + '%';
    st.style.top = (Math.random() * 70) + '%';
    st.style.fontSize = (9 + Math.random() * 10) + 'px';
    st.style.animationDuration = (2.5 + Math.random() * 4) + 's';
    st.style.animationDelay = (-Math.random() * 6) + 's';
    sky.appendChild(st);
  }

  var petalGlyphs = ['🌸','💮','🌷','🥀'];
  for (var p = 0; p < 18; p++) {
    var pe = document.createElement('span');
    pe.className = 'petal';
    pe.textContent = petalGlyphs[p % petalGlyphs.length];
    pe.style.left = (Math.random() * 100) + '%';
    pe.style.fontSize = (14 + Math.random() * 12) + 'px';
    pe.style.animationDuration = (8 + Math.random() * 9) + 's';
    pe.style.animationDelay = (-Math.random() * 16) + 's';
    sky.appendChild(pe);
  }

  for (var f = 0; f < 12; f++) {
    var fl = document.createElement('span');
    fl.className = 'firefly';
    fl.style.left = (Math.random() * 100) + '%';
    fl.style.top = (Math.random() * 85 + 8) + '%';
    fl.style.animationDuration = (5 + Math.random() * 6) + 's';
    fl.style.animationDelay = (-Math.random() * 8) + 's';
    sky.appendChild(fl);
  }

  /* ---------- 瞳孔跟随鼠标 ---------- */
  var pupils = document.querySelectorAll('.pupil');
  document.addEventListener('mousemove', function (e) {
    for (var i = 0; i < pupils.length; i++) {
      var pr = pupils[i].getBoundingClientRect();
      var cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
      var dx = e.clientX - cx, dy = e.clientY - cy;
      var dist = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
      var k = Math.min(dist, 220) / 220, px = Math.cos(ang) * 4 * k, py = Math.sin(ang) * 4 * k;
      pupils[i].style.transform = 'translate(' + px + 'px,' + py + 'px)';
    }
  });

  /* ---------- 暗语显示切换 ---------- */
  var pass = document.getElementById('pass');
  var toggle = document.getElementById('toggle');
  toggle.addEventListener('click', function () {
    var show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    toggle.textContent = show ? '🙈' : '👀';
    pass.focus();
  });

  /* ---------- 提交 ---------- */
  var form = document.getElementById('loginForm');
  var user = document.getElementById('user');
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var btn = document.getElementById('submitBtn');
  var mascot = document.getElementById('mascot');
  var hearts = document.getElementById('hearts');

  function showHint(msg) {
    hint.textContent = msg; hint.classList.add('show');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var u = user.value.trim(), pw = pass.value.trim();
    if (!u) { showHint('夫君还不肯报名吗？'); user.focus(); return; }
    if (!pw) { showHint('没有暗语，如何与我结契～'); pass.focus(); return; }

    hint.classList.remove('show');
    btn.disabled = true; btn.textContent = '正在结契…';
    setTimeout(function () {
      btn.textContent = '契约成立 ♥ 你的灵魂，归我了';
      btn.classList.add('ok'); mascot.classList.add('happy'); rainHearts();
    }, 950);
  });

  function rainHearts() {
    var icons = ['💗','💞','💕','🌸','✨','🌹','💍'];
    var box = card.getBoundingClientRect();
    for (var i = 0; i < 22; i++) {
      (function (i) {
        var h = document.createElement('span');
        h.className = 'heart-fx';
        h.textContent = icons[Math.floor(Math.random() * icons.length)];
        h.style.left = (box.left + Math.random() * box.width) + 'px';
        h.style.top = (box.top + box.height * (0.3 + Math.random() * 0.45)) + 'px';
        h.style.animationDelay = (i * 0.045) + 's';
        h.style.fontSize = (14 + Math.random() * 16) + 'px';
        hearts.appendChild(h);
        setTimeout(function () { h.remove(); }, 2600 + i * 60);
      })(i);
    }
  }

  [user, pass].forEach(function (el) {
    el.addEventListener('input', function () { hint.classList.remove('show'); });
  });
})();
</script>
</body>
</html>
