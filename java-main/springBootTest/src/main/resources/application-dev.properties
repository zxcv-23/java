server.port=8081

# ===== 数据源（MySQL 8.0，本地 root / 123456） =====
# 如果你本地 MySQL 密码不同，请修改 spring.datasource.password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/guiniang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== MyBatis-Plus 配置 =====
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除（与实体 deleted 字段配合）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.db-config.logic-delete-value=1
# SQL 执行日志（开发期便于排查，生产可注释）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
