server.port=8081
server.address=192.168.68.22
# 数据库连接保持 127.0.0.1：MySQL 的 root@localhost 账号只允许本机连接，改成局域网 IP 会导致后端连不上库

# ===== 数据源（MySQL 8.0，本地 root / 123456） =====
# 库名必须与本机 MySQL 里实际存在的库一致：本机业务库是 dd（Navicat 里看到的那个）。
# 之前写成 guiniang，但该库并不存在，连错库会导致启动失败 / 注册的数据"看不到"。
# 如果你本地 MySQL 密码不同，请修改 spring.datasource.password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# characterEncoding 用 UTF-8（Connector/J 8 映射到 utf8mb4，含 emoji 也能正确写入）；
# 旧值 utf8 是 utf8mb3 别名，历史上曾导致初始化脚本里的中文被按 GBK 解读成乱码。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/dd?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== 启动时自动建表 + 灌入示例数据（幂等：IF NOT EXISTS / INSERT IGNORE） =====
# 应用启动即自建 category / item 等表并写入示例数据，无需手动执行 SQL
# optional: 前缀很关键：脚本偶尔没被 IDEA 增量编译拷进 classpath 时，
# 跳过初始化而不是抛 "No schema scripts found" 直接让整个应用启动失败。
# 建表补列的兜底由 config/SchemaMigration.java 在启动后幂等完成。
spring.sql.init.mode=always
spring.sql.init.schema-locations=optional:classpath:schema.sql
spring.sql.init.data-locations=optional:classpath:data.sql
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8

# ===== 文件上传（个人中心头像） =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 头像/图片存储目录与访问前缀 =====
# 上传目录为相对项目根目录的 uploads/，访问地址为 /uploads/xxx.jpg
file.upload.dir=uploads
file.upload.url-prefix=/uploads/

# ===== 头像处理（居中裁正方形 + 缩放 + 压缩为 JPEG） =====
# 输出正方形边长（像素）
file.upload.avatar-size=256
# JPEG 压缩质量 0.0~1.0，越大越清晰、体积越大
file.upload.image-quality=0.85

# ===== JWT 登录鉴权 =====
# 密钥至少 32 字节（HS256 要求 256 位），请在生产环境替换为强随机值
jwt.secret=guiniangHuajiaSecretKeyForJwtSigningDoNotShareThisString1234567890
# 有效期：默认 24 小时（单位毫秒）
jwt.expiration=86400000
# 后台管理员 token 有效期：8 小时（权限更高，缩短有效期）
jwt.admin-expiration=28800000

# ===== MyBatis-Plus 配置 =====
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除（与实体 deleted 字段配合）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.db-config.logic-delete-value=1
# SQL 执行日志（开发期便于排查，生产可注释）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 相亲阁跳转（首页导航栏「姻缘阁 · 寻缘」按钮的目标）=====
# 前端首页 HomePage.vue 通过 GET /api/partner/site 读取这里，不写死地址。
# partner.site.url 可写本站相对路径（如 /dating.html，换端口也不用改），
# 也可写完整外部网址；GET /go/partner 会 302 到该地址，可供对方站做回链。
# 相亲展示页：/dating.html（后端静态页，数据来源 /api/dating/candidates）
# 想改成纯外链（例如某个外部相亲站），只改 partner.site.url 一行即可。
# .properties 按 ISO-8859-1 读取，中文值必须写成 Unicode 转义，否则按钮文案会变乱码
partner.site.name=\u59FB\u7F18\u9601 \u00B7 \u5BFB\u7F18
partner.site.url=/dating.html
partner.site.enabled=true
# 页面右上角「去 Google 搜相亲资料」外链；GET /go/google 也会 302 到这里。
# 注意：Google 在部分网络环境下无法直接访问，改这里即可换成任意可访问的搜索站。
partner.site.google-url=https://www.google.com/search?q=dating+matchmaking+profile
