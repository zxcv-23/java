server.port=8081

# ===== 数据源（MySQL 8.0，本地 root / 123456） =====
# 如果你本地 MySQL 密码不同，请修改 spring.datasource.password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/guiniang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== 启动时自动建表 + 灌入示例数据（幂等：IF NOT EXISTS / INSERT IGNORE） =====
# 应用启动即自建 category / item 等表并写入示例数据，无需手动执行 SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8

# ===== 文件上传（个人中心头像） =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 头像/图片存储目录与访问前缀 =====
# 上传目录为相对项目根目录的 uploads/，访问地址为 /uploads/xxx.jpg
file.upload.dir=uploads
file.upload.url-prefix=/uploads/

# ===== 头像处理（居中裁正方形 + 缩放 + 压缩为 JPEG） =====
# 输出正方形边长（像素）
file.upload.avatar-size=256
# JPEG 压缩质量 0.0~1.0，越大越清晰、体积越大
file.upload.image-quality=0.85

# ===== JWT 登录鉴权 =====
# 密钥至少 32 字节（HS256 要求 256 位），请在生产环境替换为强随机值
jwt.secret=guiniangHuajiaSecretKeyForJwtSigningDoNotShareThisString1234567890
# 有效期：默认 24 小时（单位毫秒）
jwt.expiration=86400000

# ===== MyBatis-Plus 配置 =====
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除（与实体 deleted 字段配合）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.db-config.logic-delete-value=1
# SQL 执行日志（开发期便于排查，生产可注释）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
