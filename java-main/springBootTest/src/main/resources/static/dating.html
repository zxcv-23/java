<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姻缘阁 · 寻一位中意的人</title>
<style>
  :root{
    --bg:#fff; --soft:#f8f9fa; --ink:#202124; --muted:#5f6368;
    --line:#e8eaed; --blue:#1a73e8; --rose:#e0455f; --rose-soft:#fff1f3;
    --shadow:0 1px 6px rgba(60,64,67,.10); --shadow-hi:0 8px 26px rgba(60,64,67,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:.5px}
  .dots{display:inline-flex;gap:3px}
  .dots i{width:8px;height:8px;border-radius:50%;display:block}
  .nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .nav a,.nav button{border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:8px 15px;font-size:13px;color:var(--muted);transition:.18s}
  .nav a:hover,.nav button:hover{border-color:#c8ccd2;color:var(--ink);box-shadow:var(--shadow)}
  .nav .picks-btn{border-color:#f3c9d1;color:var(--rose);background:var(--rose-soft)}
  .pick-count{font-weight:700}

  /* ---------- 搜索区（Google 式极简） ---------- */
  .hero{max-width:820px;margin:0 auto;padding:64px 24px 0;text-align:center}
  .hero h1{font-size:clamp(30px,5vw,46px);font-weight:600;letter-spacing:2px;margin:0 0 12px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,#4285F4,#EA4335,#FBBC05,#34A853);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:14px;margin:0 0 30px;line-height:1.8}
  .searchbox{display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto;
    border:1px solid #dfe1e5;border-radius:999px;padding:0 18px;height:52px;
    background:#fff;box-shadow:var(--shadow);transition:.18s}
  .searchbox:focus-within{box-shadow:var(--shadow-hi);border-color:transparent}
  .searchbox svg{flex:none;width:20px;height:20px;fill:#9aa0a6}
  .searchbox input{flex:1;border:0;outline:0;font-size:16px;color:var(--ink);background:transparent;min-width:0}
  .searchbox input::placeholder{color:#9aa0a6}
  .clear{border:0;background:transparent;color:#9aa0a6;font-size:20px;line-height:1;padding:4px 6px;display:none}
  .clear.show{display:block}
  .search-hint{margin-top:12px;font-size:12px;color:#9aa0a6}

  /* ---------- 筛选 ---------- */
  .filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:26px auto 0}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;
    font-size:13px;color:var(--muted);transition:.18s}
  .chip:hover{background:var(--soft)}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.picked.active{background:var(--rose);border-color:var(--rose)}

  /* ---------- 结果区 ---------- */
  main{max-width:1120px;margin:0 auto;padding:28px 24px 72px}
  .notice{max-width:760px;margin:0 auto 22px;padding:12px 16px;border-radius:12px;
    background:#fff8e6;border:1px solid #f6e2a8;color:#7a5b12;font-size:13px;line-height:1.7;display:none}
  .notice.show{display:block}
  .result-bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:var(--muted)}
  .result-bar b{color:var(--ink);font-size:15px}
  .src-tag{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px}
  .src-tag.demo{background:#fff8e6;border-color:#f6e2a8;color:#7a5b12}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;background:#fff;
    text-align:center;transition:.2s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:#dfe1e5}
  .avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;
    justify-content:center;font-size:32px;font-weight:600;color:#fff;overflow:hidden;cursor:pointer;
    position:relative;background:linear-gradient(135deg,#f6a5b6,#e0455f)}
  .avatar.male{background:linear-gradient(135deg,#8ab4f8,#1a73e8)}
  .avatar.unknown{background:linear-gradient(135deg,#c5cbd3,#80868b)}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .name{font-size:17px;font-weight:600;margin:0 0 6px;cursor:pointer}
  .name:hover{color:var(--blue)}
  .meta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
  .badge.g1{background:#eef4ff;color:#1a73e8;border-color:#d8e6ff}
  .badge.g2{background:var(--rose-soft);color:var(--rose);border-color:#f6d3da}
  .bio{font-size:13px;color:var(--muted);line-height:1.7;min-height:44px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 16px}
  .like{width:100%;border:1px solid #f3c9d1;background:var(--rose-soft);color:var(--rose);
    border-radius:999px;padding:9px 0;font-size:13px;font-weight:600;transition:.18s}
  .like:hover{background:#ffe3e9}
  .like.on{background:var(--rose);border-color:var(--rose);color:#fff}
  .empty{text-align:center;padding:64px 20px;color:var(--muted)}
  .empty .ico{font-size:44px;margin-bottom:14px}
  .empty h3{color:var(--ink);font-size:18px;margin:0 0 8px}
  .empty p{font-size:13px;line-height:1.8;margin:0 0 18px}
  .empty a{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:10px 20px;font-size:13px}

  /* ---------- 心动抽屉 / 详情弹层 ---------- */
  .mask{position:fixed;inset:0;background:rgba(32,33,36,.38);opacity:0;pointer-events:none;transition:.22s;z-index:20}
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:#fff;z-index:21;
    transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
  .drawer.show{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line)}
  .drawer-head h2{font-size:17px;margin:0}
  .drawer-head button{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1}
  .drawer-body{flex:1;overflow:auto;padding:14px 20px}
  .pick-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .pick-row .mini{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;background:linear-gradient(135deg,#f6a5b6,#e0455f)}
  .pick-row .txt{flex:1;min-width:0}
  .pick-row .txt b{display:block;font-size:14px}
  .pick-row .txt span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-row button{border:0;background:transparent;color:var(--muted);font-size:18px}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--line)}
  .drawer-foot button{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px;font-size:13px;color:var(--muted)}
  .drawer-foot button:hover{background:var(--soft)}

  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:22;
    width:min(400px,92vw);background:#fff;border-radius:22px;padding:30px 26px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.22s}
  .modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .modal .avatar{width:96px;height:96px}
  .modal h2{margin:0 0 6px;font-size:21px}
  .modal .m-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .modal .m-bio{font-size:14px;line-height:1.9;color:var(--muted);background:var(--soft);border-radius:12px;padding:14px;margin:0 0 20px}
  .modal .like{padding:11px 0}

  footer{border-top:1px solid var(--line);padding:22px 24px;text-align:center;color:#9aa0a6;font-size:12px;line-height:1.9}
  footer a{color:var(--blue)}
  @media(max-width:560px){.hero{padding-top:40px}header{padding:12px 16px}main{padding:22px 14px 56px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dots"><i style="background:#4285F4"></i><i style="background:#EA4335"></i><i style="background:#FBBC05"></i><i style="background:#34A853"></i></span>
    姻缘阁 · 寻缘
  </div>
  <nav class="nav">
    <a id="googleLink" href="https://www.google.com/search?q=dating+matchmaking+profile" target="_blank" rel="noopener noreferrer"
       title="在 Google 搜索更多相亲资料（需可访问 Google 的网络）">↗ 去 Google 搜相亲资料</a>
    <button class="picks-btn" id="openPicks">♥ 已心动 <span class="pick-count" id="pickCount">0</span> 位</button>
  </nav>
</header>

<section class="hero">
  <h1>寻一位<em>中意的人</em></h1>
  <p>姻缘簿已为你展开 —— 搜一搜、看一看，把心动的人收进名单里 ♥</p>
  <div class="searchbox">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="kw" type="search" autocomplete="off" placeholder="搜昵称、简介，例如：爱看书的姑娘">
    <button class="clear" id="clearKw" title="清空">×</button>
  </div>
  <div class="search-hint">资料来自本站注册用户，已隐去手机号、邮箱与登录信息</div>
  <div class="filters" id="filters">
    <button class="chip active" data-gender="0">全部</button>
    <button class="chip" data-gender="1">公子</button>
    <button class="chip" data-gender="2">姑娘</button>
    <button class="chip picked" id="pickedChip">只看已心动</button>
  </div>
</section>

<main>
  <div class="notice" id="notice"></div>
  <div class="result-bar">
    <div>为你找到 <b id="total">0</b> 位有缘人</div>
    <span class="src-tag" id="srcTag">正在读取姻缘簿…</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="ico">🪷</div>
    <h3>还没有中意的人</h3>
    <p>换个关键词或筛选条件试试，也可以先去本站注册，让自己出现在姻缘簿上。</p>
    <a href="http://127.0.0.1:5173/" target="_blank" rel="noopener noreferrer">去注册 · 入姻缘簿</a>
  </div>
</main>

<footer>
  <div>姻缘阁 · 寻缘　|　数据接口 <code>/api/dating/candidates</code>　|　跳转端点 <code>/go/partner</code></div>
  <div>本站为课程项目演示页，嘉宾资料仅展示昵称、性别与简介；<a id="googleFoot" href="https://www.google.com/search?q=dating+matchmaking+profile" target="_blank" rel="noopener noreferrer">在 Google 搜索相亲资料 ↗</a></div>
</footer>

<div class="mask" id="mask"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-head"><h2>♥ 心动名单</h2><button id="closeDrawer" title="关闭">×</button></div>
  <div class="drawer-body" id="pickList"></div>
  <div class="drawer-foot"><button id="clearPicks">清空名单</button></div>
</aside>

<div class="modal" id="modal">
  <div id="mAvatarBox"></div>
  <h2 id="mName"></h2>
  <div class="m-sub" id="mSub"></div>
  <div class="m-bio" id="mBio"></div>
  <button class="like" id="mLike"></button>
</div>

<script>
/* ---------------- 演示嘉宾（仅当库中还没有注册用户时兜底展示） ---------------- */
const DEMO = [
  {id:'d1', nickname:'云想衣裳', gender:2, avatar:'', bio:'爱看旧书与雨天，想找一位能一起慢慢逛街的人。', tag:'新入阁', joinedAt:'2026-11-01', demo:true},
  {id:'d2', nickname:'沈砚',     gender:1, avatar:'', bio:'会做一手好菜，周末常去爬山，话不多但很靠谱。', tag:'姻缘簿在册', joinedAt:'2026-10-22', demo:true},
  {id:'d3', nickname:'阿棠',     gender:2, avatar:'', bio:'摄影与猫，两者都爱。希望遇见愿意陪我等日落的人。', tag:'新入阁', joinedAt:'2026-11-03', demo:true},
  {id:'d4', nickname:'林间客',   gender:1, avatar:'', bio:'喜欢安静，偶尔弹琴。寻觅能聊一整晚的那种投缘。', tag:'姻缘簿在册', joinedAt:'2026-10-15', demo:true},
  {id:'d5', nickname:'小满',     gender:2, avatar:'', bio:'甜品爱好者，也爱长跑。想找个能一起做饭的伙伴。', tag:'姻缘簿在册', joinedAt:'2026-10-28', demo:true},
  {id:'d6', nickname:'归舟',     gender:1, avatar:'', bio:'在城里做设计，闲暇写点小诗，等一个懂的人。', tag:'新入阁', joinedAt:'2026-11-04', demo:true}
];

const PICK_KEY = 'dating_picks_v1';
const FROM_SITE = new URLSearchParams(location.search).has('from');
const state = {keyword:'', gender:0, pickedOnly:false, list:[], demo:false, detail:null};
let picks;
try { picks = new Set(JSON.parse(localStorage.getItem(PICK_KEY) || '[]')); }
catch (e) { picks = new Set(); }

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = c => String(c.id);

function savePicks(){
  try { localStorage.setItem(PICK_KEY, JSON.stringify([...picks])); } catch (e) {}
  $('pickCount').textContent = picks.size;
}

/* ---------------- 数据加载 ---------------- */
async function load(){
  $('srcTag').textContent = '正在读取姻缘簿…';
  $('srcTag').className = 'src-tag';
  let list = [], demo = false, err = '';
  try {
    const url = '/api/dating/candidates?limit=100'
      + '&keyword=' + encodeURIComponent(state.keyword)
      + (state.gender ? '&gender=' + state.gender : '');
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const json = await res.json();
    list = (json && json.code === 200 && Array.isArray(json.data)) ? json.data : [];
    if (!list.length) { demo = true; err = '库中暂无注册用户'; }
  } catch (e) {
    demo = true;
    err = '后端接口暂不可用（' + e.message + '）';
  }
  if (demo) {
    state.list = DEMO; state.demo = true;
    $('notice').innerHTML = '⚠️ ' + esc(err) + '，当前展示的是 <b>演示嘉宾</b>。注册用户出现后会自动改为展示真实资料。'
      + (FROM_SITE ? '<br>🪷 你是从主站跳转过来的，慢慢挑，心动的人会记在这台浏览器里。' : '');
    $('notice').classList.add('show');
    $('srcTag').textContent = '演示资料'; $('srcTag').className = 'src-tag demo';
  } else {
    state.list = list; state.demo = false;
    if (FROM_SITE) {
      $('notice').innerHTML = '🪷 你是从主站跳转过来的 —— 慢慢挑，心动的人会记在这台浏览器里。';
      $('notice').classList.add('show');
    } else {
      $('notice').classList.remove('show');
    }
    $('srcTag').textContent = '本站注册用户 · 已脱敏'; $('srcTag').className = 'src-tag';
  }
  render();
}

/* 演示模式下所有筛选在前端完成；真实模式下后端已按关键词/性别过滤 */
function visible(){
  let list = state.list;
  if (state.demo) {
    const kw = state.keyword.trim().toLowerCase();
    list = list.filter(c =>
      (!kw || (c.nickname + ' ' + c.bio).toLowerCase().includes(kw)) &&
      (!state.gender || c.gender === state.gender));
  }
  if (state.pickedOnly) list = list.filter(c => picks.has(keyOf(c)));
  return list;
}

function avatarHtml(c){
  const g = Number(c.gender) === 1 ? 'male' : Number(c.gender) === 2 ? '' : 'unknown';
  const img = c.avatar
    ? '<img src="' + esc(c.avatar) + '" alt="" onerror="this.style.display=\'none\'">'
    : '';
  return '<div class="avatar ' + g + '" data-avatar="' + esc(c.id) + '">'
       + esc(c.nickname.charAt(0)) + img + '</div>';
}

function badge(c){
  const g = Number(c.gender);
  const label = g === 1 ? '公子' : g === 2 ? '姑娘' : '未留';
  return '<span class="badge g' + g + '">' + label + '</span>'
       + '<span class="badge">' + esc(c.tag || '姻缘簿在册') + '</span>';
}

function render(){
  const list = visible();
  $('total').textContent = list.length;
  $('empty').style.display = list.length ? 'none' : 'block';
  $('grid').innerHTML = list.map(c => {
    const on = picks.has(keyOf(c));
    return '<article class="card">'
      + avatarHtml(c)
      + '<div class="name" data-name="' + esc(c.id) + '">' + esc(c.nickname) + '</div>'
      + '<div class="meta">' + badge(c) + '</div>'
      + '<p class="bio">' + esc(c.bio) + '</p>'
      + '<button class="like ' + (on ? 'on' : '') + '" data-like="' + esc(c.id) + '">'
      + (on ? '♥ 已心动' : '♡ 心动') + '</button>'
      + '</article>';
  }).join('');
}

function find(id){ return state.list.find(c => keyOf(c) === String(id)); }

function toggleLike(id){
  const k = String(id);
  if (picks.has(k)) picks.delete(k); else picks.add(k);
  savePicks();
  if (state.demo || state.pickedOnly) render(); else {
    // 真实模式：仅刷新按钮态，不重新请求接口
    document.querySelectorAll('[data-like]').forEach(btn => {
      const on = picks.has(String(btn.dataset.like));
      btn.className = 'like' + (on ? ' on' : '');
      btn.textContent = on ? '♥ 已心动' : '♡ 心动';
    });
  }
  renderPicks();
  if (state.detail && keyOf(state.detail) === k) renderModal();
}

/* ---------------- 心动抽屉 ---------------- */
function renderPicks(){
  const chosen = state.list.filter(c => picks.has(keyOf(c)));
  const unknown = [...picks].filter(k => !state.list.some(c => keyOf(c) === k));
  let html = chosen.map(c =>
    '<div class="pick-row"><div class="mini">' + esc(c.nickname.charAt(0)) + '</div>'
    + '<div class="txt"><b>' + esc(c.nickname) + '</b><span>' + esc(c.bio) + '</span></div>'
    + '<button data-remove="' + esc(c.id) + '" title="移出名单">×</button></div>').join('');
  if (unknown.length) html += '<div class="pick-row"><div class="txt"><span>另有 ' + unknown.length + ' 位往期心动记录（当前列表未加载）</span></div></div>';
  $('pickList').innerHTML = html || '<div class="empty" style="padding:40px 0"><div class="ico">💌</div><h3>名单还是空的</h3><p>看到中意的人，点一下「♡ 心动」就会收进来。</p></div>';
}

function closeOverlays(){
  $('mask').classList.remove('show');
  $('drawer').classList.remove('show');
  $('modal').classList.remove('show');
  state.detail = null;
}

/* ---------------- 详情弹层 ---------------- */
function renderModal(){
  const c = state.detail;
  if (!c) return;
  $('mAvatarBox').innerHTML = avatarHtml(c);
  $('mName').textContent = c.nickname;
  $('mSub').textContent = (Number(c.gender) === 1 ? '公子' : Number(c.gender) === 2 ? '姑娘' : '性别未留')
    + ' · ' + (c.tag || '姻缘簿在册') + (c.joinedAt ? ' · ' + c.joinedAt + ' 入阁' : '');
  $('mBio').textContent = c.bio;
  const on = picks.has(keyOf(c));
  $('mLike').textContent = on ? '♥ 已心动，点击查看名单' : '♡ 收进心动名单';
  $('mLike').className = 'like' + (on ? ' on' : '');
}
function openModal(id){
  const c = find(id);
  if (!c) return;
  state.detail = c;
  renderModal();
  $('mask').classList.add('show');
  $('modal').classList.add('show');
}

/* ---------------- 事件绑定 ---------------- */
let timer = null;
$('kw').addEventListener('input', e => {
  state.keyword = e.target.value;
  $('clearKw').classList.toggle('show', !!state.keyword);
  clearTimeout(timer);
  timer = setTimeout(load, state.demo ? 0 : 280);
});
$('kw').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); load(); } });
$('clearKw').addEventListener('click', () => {
  $('kw').value = ''; state.keyword = ''; $('clearKw').classList.remove('show'); load();
});
$('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.id === 'pickedChip') {
    state.pickedOnly = !state.pickedOnly;
    chip.classList.toggle('active', state.pickedOnly);
    render();
  } else {
    state.gender = Number(chip.dataset.gender);
    document.querySelectorAll('#filters .chip[data-gender]').forEach(c => c.classList.toggle('active', c === chip));
    load();
  }
});
$('grid').addEventListener('click', e => {
  const like = e.target.closest('[data-like]');
  if (like) { toggleLike(like.dataset.like); return; }
  const open = e.target.closest('[data-name],[data-avatar]');
  if (open) openModal(open.dataset.name || open.dataset.avatar);
});
$('openPicks').addEventListener('click', () => { renderPicks(); $('mask').classList.add('show'); $('drawer').classList.add('show'); });
$('closeDrawer').addEventListener('click', closeOverlays);
$('mask').addEventListener('click', closeOverlays);
$('pickList').addEventListener('click', e => {
  const rm = e.target.closest('[data-remove]');
  if (!rm) return;
  picks.delete(String(rm.dataset.remove)); savePicks(); renderPicks(); render();
});
$('clearPicks').addEventListener('click', () => { picks.clear(); savePicks(); renderPicks(); render(); });
$('mLike').addEventListener('click', () => { if (state.detail) toggleLike(keyOf(state.detail)); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

/* 跳转目标由后端配置驱动：/api/partner/site 提供 Google 外链，失败时用兜底值 */
(async function init(){
  savePicks();
  try {
    const res = await fetch('/api/partner/site');
    const json = await res.json();
    const url = json && json.data && json.data.googleUrl;
    if (url) { $('googleLink').href = url; $('googleFoot').href = url; }
  } catch (e) { /* 后端不可用时保留默认 Google 搜索地址 */ }
  load();
})();
</script>
</body>
</html>
